# Kit-owned. Policy is enforced here, not in markdown.
name: adlc
on:
  pull_request:
  push: { branches: [main] }
  schedule:
    - cron: "17 2 * * *"   # drift, nightly
    - cron: "23 3 * * 1"   # regress, weekly
  workflow_dispatch:
jobs:
  contract-lint:
    if: github.event_name == 'pull_request'
    uses: hpreowned/adlc-kit/.github/workflows/adlc-contract-lint.yml@v0.1.7
  baseline:
    if: github.event_name == 'push'
    uses: hpreowned/adlc-kit/.github/workflows/adlc-baseline.yml@v0.1.7
    permissions: { contents: write }
  drift:
    if: github.event_name == 'schedule' && github.event.schedule == '17 2 * * *'
    uses: hpreowned/adlc-kit/.github/workflows/adlc-drift.yml@v0.1.7
  regress:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * 1'
    uses: hpreowned/adlc-kit/.github/workflows/adlc-regress.yml@v0.1.7
    secrets: inherit
  scorecard-upload:
    needs: [regress]
    if: always() && github.event_name == 'schedule'
    uses: hpreowned/adlc-kit/.github/workflows/adlc-scorecard-upload.yml@v0.1.7
